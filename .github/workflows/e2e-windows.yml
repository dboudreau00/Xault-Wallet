name: Windows end-to-end

# The real XaultWallet.exe on a Windows machine, driven from outside through UI Automation (the
# interface screen readers use), against a private regtest chain. It starts WITHOUT monero-wallet-rpc:
# the run begins by clicking the app's own "Download & install", which fetches the official Windows
# CLI from getmonero.org, checks binaryFate's signature and the checksum, and installs it. Then: create
# a vault, verify the seed backup, duress password and decoy, unlock both wallets, receive, send,
# history, settings. Then a clean shutdown is checked: no monero-wallet-rpc left running, no wallet
# session folder in %TEMP%, nothing written next to the exe, the install where it belongs.
#
# The release workflow calls this with the exact win-x64 zip it is about to attach to the draft.
# Screenshots are uploaded as the "e2e-screens-windows" artifact. To also get them on the
# ci/e2e-screenshots branch (for viewing outside Actions), run this workflow manually with
# "publish_screenshots", or push a commit whose message contains [e2e-screenshots].
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: Also push the screenshots to the ci/e2e-screenshots branch
        type: boolean
        default: false
  workflow_call:
    inputs:
      artifact:
        description: Name of an artifact of the calling run that holds the win-x64 release zip to test
        type: string
        default: ''

permissions:
  contents: read

# In a called workflow the github context is the caller's: the artifact input tells a release run
# (never cancelled) from a push/PR run (superseded by a newer push).
concurrency:
  group: e2e-windows-${{ github.workflow_ref }}-${{ github.ref }}-${{ inputs.artifact || 'build' }}
  cancel-in-progress: ${{ !inputs.artifact }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1 # Avalonia.BuildServices: no build-time usage report

jobs:
  e2e:
    name: Real XaultWallet.exe, end to end (Windows, regtest)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: The release zip under test
        if: inputs.artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist
      - name: Or publish the exe the way the release workflow does (the zip holds only the exe here)
        if: inputs.artifact == ''
        shell: bash
        run: |
          dotnet publish src/XaultWallet.Desktop/XaultWallet.Desktop.csproj -c Release -r win-x64 -o out
          mkdir -p dist && (cd out && 7z a ../dist/XaultWallet-e2e-win-x64.zip XaultWallet.exe)
      - name: Unpack into an empty folder, as a user would
        shell: bash
        run: |
          shopt -s nullglob; zips=(dist/*win-x64*.zip)
          [ ${#zips[@]} -eq 1 ] || { echo "::error::expected one win-x64 zip, found: ${zips[*]}"; exit 1; }
          mkdir app && 7z x -oapp "${zips[0]}" >/dev/null && ls -la app

      - name: monerod for the private test chain (official CLI, checked against binaryFate's signed hashes.txt)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o hashes.txt https://www.getmonero.org/downloads/hashes.txt
          curl -fsSL --retry 3 -o binaryfate.asc https://raw.githubusercontent.com/monero-project/monero/master/utils/gpg_keys/binaryfate.asc
          GNUPGHOME="$(mktemp -d)" && export GNUPGHOME
          gpg --batch --quiet --import binaryfate.asc
          # Only the SIGNED text is used (--decrypt outputs what the signature covers), and the signer
          # must be binaryFate's key: 81AC 591F E9C4 B65C 5806 AFC3 F0AF 4D46 2A0B DF92.
          gpg --batch --status-fd 3 --output signed.txt --decrypt hashes.txt 3>status.txt
          grep -Eq '^\[GNUPG:\] VALIDSIG .*\b81AC591FE9C4B65C5806AFC3F0AF4D462A0BDF92\b' status.txt \
            || { cat status.txt; echo "::error::hashes.txt is not signed by binaryFate's key"; exit 1; }
          entry=$(grep -oE '\b[0-9a-f]{64}  monero-win-x64-v[0-9.]+\.zip\b' signed.txt | head -n 1 || true)
          [ -n "$entry" ] || { echo "::error::no Windows CLI entry in the signed hashes"; exit 1; }
          sha=${entry%% *} && file=${entry##* }
          echo "Monero CLI: $file"
          curl -fsSL --retry 3 -o "$file" "https://downloads.getmonero.org/cli/$file"
          echo "$sha  $file" | sha256sum -c -
          7z x -omonero "$file" >/dev/null
          daemons=(monero/*/monerod.exe) && daemon=${daemons[0]}
          [ -f "$daemon" ] || { echo "::error::monerod.exe not in $file"; exit 1; }
          # monero-wallet-rpc is deliberately NOT put next to XaultWallet.exe: the app installs its own.
          echo "MONEROD=$(cygpath -w "$daemon")" >> "$GITHUB_ENV"

      - name: Screen at 1920x1080 (hosted runners start at 1024x768; the test maximizes otherwise)
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Private regtest node (no network, instant mining)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'monerod.log'
          # A hidden console of its own, so it outlives this step's shell.
          Start-Process -FilePath $env:MONEROD -WindowStyle Hidden -ArgumentList @(
            '--regtest', '--offline', '--fixed-difficulty', '1', '--data-dir', (Join-Path $env:RUNNER_TEMP 'regtest'),
            '--rpc-bind-ip', '127.0.0.1', '--rpc-bind-port', '18081', '--no-igd', '--hide-my-port',
            '--non-interactive', '--log-file', $log)
          for ($i = 0; $i -lt 120; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:18081/get_info | Select-Object nettype, height, version | Format-List; exit 0 }
            catch { Start-Sleep -Seconds 1 }
          }
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          throw 'monerod did not come up'

      - name: Run the scenario against the real exe
        env:
          XW_E2E_DAEMON: http://127.0.0.1:18081
          XW_E2E_TIME_SCALE: '2'
        run: dotnet run -c Release --project tests/XaultWallet.E2E.Windows -- app\XaultWallet.exe e2e-screens-windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()   # the screenshots matter most when a step failed
        with:
          name: e2e-screens-windows
          path: e2e-screens-windows/
          if-no-files-found: warn
      - name: monerod log
        if: failure()
        shell: pwsh
        run: Get-Content (Join-Path $env:RUNNER_TEMP 'monerod.log') -Tail 60

  share-screenshots:
    name: Screenshots to the ci/e2e-screenshots branch
    needs: e2e
    # Opt-in only. This job holds a write token, so it runs no build, no tests and no checkout of the
    # code: it only commits the PNGs the e2e job uploaded.
    if: >-
      always() && needs.e2e.result != 'skipped' && !inputs.artifact && (
        (github.event_name == 'workflow_dispatch' && inputs.publish_screenshots) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[e2e-screenshots]')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-screens-windows
          path: shots
      - name: Push as a single orphan commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci/e2e-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows end-to-end screenshots: ${GITHUB_SHA::7}, run ${GITHUB_RUN_ID} (${{ needs.e2e.result }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/e2e-screenshots
