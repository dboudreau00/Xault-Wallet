name: Release

# Builds single-file, self-contained executables for each platform and attaches them (plus
# SHA256SUMS) to a DRAFT GitHub release for review. Two ways to start it:
#
#   1. Push a tag like v0.3.0-beta.
#   2. Actions -> Release -> Run workflow, and give "version" (e.g. v0.3.0-beta). The draft is created
#      for that version, targeting the commit the run started from. The git tag is created by GitHub
#      only when a person presses Publish on the draft; this workflow never creates or moves a tag.
#
# Run without a version, it only builds (a dry run) and publishes nothing.
#
# Nothing is drafted unless the Windows end-to-end test (e2e-windows.yml) passes on the exact
# win-x64 zip that will be attached.
#
# Publishing a draft creates its tag, which starts this workflow again through route 1. The plan job
# sees that the release already exists and skips everything, so that second run is a no-op.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to prepare a DRAFT release for, e.g. v0.3.0-beta. Empty = build only (dry run).'
        required: false
        default: ''
        type: string

# Default: read-only. Jobs that create a draft release or call a reusable workflow whose nested
# share-screenshots job asks for write raise the ceiling themselves. Actions are pinned to full
# commit SHAs (version in the trailing comment); Dependabot keeps the pins current.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1 # Avalonia.BuildServices: no build-time usage report

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide what this run does (and fail early on a bad release)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) tag="$GITHUB_REF_NAME" ;;
            *)            tag="${INPUT_VERSION:-}" ;;
          esac

          build=true
          publish=false
          if [ -n "$tag" ]; then
            # The tag ends up in file names and a command line: accept nothing but a version.
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$tag' is not a version tag such as v1.2.3 or v1.2.3-beta"; exit 1
            fi
            version="${tag#v}"

            project=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/XaultWallet.Desktop/XaultWallet.Desktop.csproj | head -n 1)
            if [ "$version" != "$project" ]; then
              echo "::error::$tag does not match <Version>$project</Version> in XaultWallet.Desktop.csproj"; exit 1
            fi
            if ! awk -v v="$version" '$0 == "## " v || index($0, "## " v " ") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
            fi

            # Drafts count: they are not found by tag name, only by listing. A failed call stops the job.
            existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')
            if grep -Fxq "$tag" <<<"$existing"; then
              echo "::notice::A release for $tag already exists (draft or published): nothing to build or publish."
              build=false
            else
              publish=true
            fi
          else
            echo "::notice::No version given: building only (a dry run). Nothing will be published."
          fi

          { echo "tag=$tag"; echo "build=$build"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.rid }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, exe: XaultWallet.exe }
          - { rid: linux-x64, os: ubuntu-24.04,   exe: XaultWallet }
          - { rid: osx-arm64, os: macos-14,       exe: XaultWallet }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Unit tests must pass before anything ships
        run: dotnet run -c Release --project tools/TestRunner
      - name: Publish (single file, self-contained)
        run: dotnet publish src/XaultWallet.Desktop/XaultWallet.Desktop.csproj -c Release -r ${{ matrix.rid }} -o out
      - name: Package
        shell: bash
        run: |
          mkdir dist
          name="XaultWallet-${TAG:-dev-${GITHUB_SHA::7}}-${{ matrix.rid }}"
          # The docs ship with the binary: the app points users at SECURITY.md (e.g. after a vault upgrade).
          docs=(README.md SECURITY.md CHANGELOG.md LICENSE)
          cp "${docs[@]}" out/
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd out && 7z a "../dist/${name}.zip" "${{ matrix.exe }}" "${docs[@]}")
          else
            tar -C out -czf "dist/${name}.tar.gz" "${{ matrix.exe }}" "${docs[@]}"
          fi
      - name: Installer (Windows; unsigned, like the zip)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # Inno Setup is on the Windows runner image; install the pinned version only if it isn't.
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.1 -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          $version = @(([xml](Get-Content src/XaultWallet.Desktop/XaultWallet.Desktop.csproj)).Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $numeric = ($version -split '-')[0]
          $tag = if ($env:TAG) { $env:TAG } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          & $iscc /Q "/DAppVersion=$version" "/DAppNumericVersion=$numeric" "/DSourceDir=$PWD\out" "/DOutputDir=$PWD\dist" "/DOutputBaseName=XaultWallet-$tag-win-x64-setup" installer\XaultWallet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - name: The installer installs the published exe and uninstalls cleanly (silent, current user)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter '*-setup.exe')[0]
          $dir = Join-Path $env:RUNNER_TEMP 'xw-install-test'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\XaultWallet.exe")) { throw 'XaultWallet.exe was not installed' }
          if ((Get-FileHash "$dir\XaultWallet.exe").Hash -ne (Get-FileHash out\XaultWallet.exe).Hash) { throw 'The installed exe differs from the published one' }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall exited with $($u.ExitCode)" }
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\XaultWallet.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\XaultWallet.exe") { throw 'Uninstalling left XaultWallet.exe behind' }
          Write-Host "Installer OK: $($setup.Name) installs the published exe and uninstalls cleanly."
      - name: MSI package (Windows; WiX Toolset 3, unsigned)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # WiX 3.14 is on the Windows runner image (its installer sets WIX); install it only if it isn't.
          $wix = $env:WIX
          if (-not $wix -or -not (Test-Path (Join-Path $wix 'bin\candle.exe'))) {
            $wix = @(Get-ChildItem ${env:ProgramFiles(x86)} -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending)[0].FullName
          }
          if (-not $wix) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = @(Get-ChildItem ${env:ProgramFiles(x86)} -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending)[0].FullName
          }
          $bin = Join-Path $wix 'bin'
          $version = @(([xml](Get-Content src/XaultWallet.Desktop/XaultWallet.Desktop.csproj)).Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $numeric = ($version -split '-')[0]
          $tag = if ($env:TAG) { $env:TAG } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          & "$bin\candle.exe" -nologo -arch x64 "-dVersion=$numeric" "-dSourceDir=$PWD\out" "-dRepoDir=$PWD" -out "$PWD\obj-msi\XaultWallet.wixobj" installer\XaultWallet.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed ($LASTEXITCODE)" }
          # -spdb: no .wixpdb (WiX's debug database) next to the MSI; dist/ holds only what ships.
          & "$bin\light.exe" -nologo -spdb -ext WixUIExtension -cultures:en-us -out "dist\XaultWallet-$tag-win-x64.msi" "obj-msi\XaultWallet.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light failed ($LASTEXITCODE)" }
          Remove-Item dist\*.wixpdb -ErrorAction SilentlyContinue
          $unexpected = @(Get-ChildItem dist | Where-Object { $_.Name -notmatch '\.(zip|exe|msi)$' })
          if ($unexpected.Count -gt 0) { throw "Unexpected files in dist: $($unexpected.Name -join ', ')" }
      - name: The MSI installs the published exe and uninstalls cleanly (silent, current user)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem dist -Filter '*.msi')[0].FullName
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "msiexec /i exited with $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\XaultWallet\XaultWallet.exe'
          if (-not (Test-Path $exe)) { throw "XaultWallet.exe was not installed at $exe" }
          if ((Get-FileHash $exe).Hash -ne (Get-FileHash out\XaultWallet.exe).Hash) { throw 'The installed exe differs from the published one' }
          $u = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec /x exited with $($u.ExitCode)" }
          if (Test-Path $exe) { throw 'Uninstalling left XaultWallet.exe behind' }
          Write-Host "MSI OK: $(Split-Path $msi -Leaf) installs the published exe and uninstalls cleanly."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*

  e2e-windows:
    name: Windows end-to-end on the exact zip being released
    needs: [plan, publish]
    if: needs.plan.outputs.build == 'true'
    # Ceiling for the reusable workflow: its share-screenshots job requests contents: write
    # (skipped when artifact is set, as here). The nested e2e job itself pins contents: read.
    permissions:
      contents: write
    uses: ./.github/workflows/e2e-windows.yml
    with:
      artifact: dist-win-x64

  release:
    name: Draft release
    needs: [plan, publish, e2e-windows]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*   # the packages only: never the end-to-end screenshots
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes (warning + this version's CHANGELOG section)
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 == "## " v || index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > section.md
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1
          fi
          {
            echo "**Unaudited beta: do not use with real funds.** The binaries and the Windows installers are unsigned; verify them against \`SHA256SUMS\`. \`monero-wallet-rpc\` is not bundled: download and verify it from getmonero.org."
            # Relative links (docs/…, SECURITY.md#…) would resolve against the releases page: pin them to
            # the exact commit being released, which exists even while the tag does not (a draft).
            perl -pe 's{\]\((?!https?://|#|mailto:)([^)\s]+)\)}{](https://github.com/$ENV{GITHUB_REPOSITORY}/blob/$ENV{GITHUB_SHA}/$1)}g' section.md
          } > notes.md
      - name: Draft release (unsigned binaries; review before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release version (v0.3.0-beta) must never show up as the repository's "Latest release".
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          # --target pins the tag GitHub will create on Publish to the commit that was built. It is
          # ignored when the tag already exists (route 1).
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft $pre \
            --target "$GITHUB_SHA" --title "XaultWallet $TAG" --notes-file notes.md
